<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mira's Cottage — Spot the Difference</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <header id="hud">
    <div class="hud-left">
      <h1 id="game-title">Mira's Cottage</h1>
      <p id="level-name">Level 1 · The Cozy Cottage</p>
    </div>
    <div class="hud-mid">
      <div class="stat"><span class="stat-label">Found</span><span id="found-count" class="stat-value">0 / 8</span></div>
      <div class="stat"><span class="stat-label">Score</span><span id="score-value" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">Time</span><span id="time-value" class="stat-value">3:00</span></div>
    </div>
    <div class="hud-right">
      <button id="hint-button" type="button" title="Hint (H) — costs 25 points">Hint 💡 <span id="hints-left">3</span></button>
      <button id="restart-button" type="button" title="Restart level (R)">Restart ↺</button>
    </div>
  </header>

  <div id="timer-bar"><div id="timer-fill"></div></div>

  <div id="stage">
    <canvas id="game-canvas" width="1240" height="540" aria-label="Two near-identical pictures side by side. Click a difference in either picture to mark it."></canvas>

    <div id="overlay" class="overlay hidden">
      <div id="overlay-card">
        <h2 id="overlay-title">Spot the Difference</h2>
        <p id="overlay-text"></p>
        <div id="overlay-buttons"></div>
        <p id="overlay-hint" class="overlay-small"></p>
      </div>
    </div>
  </div>

  <footer id="help-bar">
    <span>Click a difference in either picture to circle it.</span>
    <span><kbd>H</kbd> hint (−25 pts)</span>
    <span><kbd>R</kbd> restart</span>
    <span><kbd>P</kbd> pause</span>
    <span><kbd>Enter</kbd> start / next</span>
  </footer>
  <div id="testlog" aria-hidden="true"></div>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
